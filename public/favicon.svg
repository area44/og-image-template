<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f50" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f50" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient glow background -->
  <circle cx="50" cy="50" r="45" fill="url(#glow-grad)" opacity="0.8" />

  <!-- Layer 1: Backing "Card Frame" (symbolizing image canvas) -->
  <rect x="22" y="26" width="56" height="38" rx="8" fill="url(#accent-grad)" stroke="#27272a" stroke-width="1.5" transform="rotate(-6 50 50)" opacity="0.7" />

  <!-- Layer 2: Main Foreground "Card Frame" (active OG layout) -->
  <rect x="25" y="28" width="56" height="38" rx="8" fill="#09090b" stroke="url(#primary-grad)" stroke-width="1.5" />

  <!-- Grid lines inside the main card -->
  <line x1="33" y1="36" x2="68" y2="36" stroke="#27272a" stroke-width="2" stroke-linecap="round" />
  <line x1="33" y1="43" x2="55" y2="43" stroke="#18181b" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing Flame/Spark Badge in the bottom-right corner -->
  <g transform="translate(56, 42)">
    <circle cx="16" cy="16" r="15" fill="url(#primary-grad)" />
    <!-- White Flame Icon nested inside -->
    <path d="M16 8C16 8 18.5 13 18.5 16.5C18.5 20 15.25 22.5 12 22.5C8.75 22.5 6.5 20 6.5 16.5C6.5 13 11 9 11 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(1.5, 0.5)" />
    <path d="M16 15C16 15 18 19 18 21.5C18 24 15.5 26 13 26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(1.5, 0.5)" />
  </g>
</svg>
