<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#09090b" />

  <!-- Ambient glowing gradient in the top-right -->
  <defs>
    <radialGradient id="ambient-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coral-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f50" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7f50" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="vite-grad-bg" x1="-0.828%" y1="57.636%" x2="57.626%" y2="-7.909%">
      <stop offset="0%" stop-color="#41D1FF" />
      <stop offset="100%" stop-color="#BD34FE" />
    </linearGradient>
    <linearGradient id="vite-grad-bolt" x1="43.376%" y1="2.242%" x2="50.316%" y2="89.03%">
      <stop offset="0%" stop-color="#FFEA83" />
      <stop offset="8.333%" stop-color="#FFDD35" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#ambient-glow)" />

  <!-- Grid patterns -->
  <g opacity="0.03">
    <path d="M 0,30 L 1200,30 M 0,60 L 1200,60 M 0,90 L 1200,90 M 0,120 L 1200,120 M 0,150 L 1200,150 M 0,180 L 1200,180 M 0,210 L 1200,210 M 0,240 L 1200,240 M 0,270 L 1200,270 M 0,300 L 1200,300 M 0,330 L 1200,330 M 0,360 L 1200,360 M 0,390 L 1200,390 M 0,420 L 1200,420 M 0,450 L 1200,450 M 0,480 L 1200,480 M 0,510 L 1200,510 M 0,540 L 1200,540 M 0,570 L 1200,570 M 0,600 L 1200,600" stroke="#ffffff" stroke-width="1" />
    <path d="M 30,0 L 30,630 M 60,0 L 60,630 M 90,0 L 90,630 M 120,0 L 120,630 M 150,0 L 150,630 M 180,0 L 180,630 M 210,0 L 210,630 M 240,0 L 240,630 M 270,0 L 270,630 M 30,0 L 300,630 M 300,0 L 300,630 M 330,0 L 330,630 M 360,0 L 360,630 M 390,0 L 390,630 M 420,0 L 420,630 M 450,0 L 450,630 M 480,0 L 480,630 M 510,0 L 510,630 M 540,0 L 540,630 M 570,0 L 570,630 M 600,0 L 600,630 M 630,0 L 630,630 M 660,0 L 660,630 M 690,0 L 690,630 M 720,0 L 720,630 M 750,0 L 750,630 M 780,0 L 780,630 M 810,0 L 810,630 M 840,0 L 840,630 M 870,0 L 870,630 M 900,0 L 900,630 M 930,0 L 930,630 M 960,0 L 960,630 M 990,0 L 990,630 M 1020,0 L 1020,630 M 1050,0 L 1050,630 M 1080,0 L 1080,630 M 1110,0 L 1110,630 M 1140,0 L 1140,630 M 1170,0 L 1170,630" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dual Borders -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#18181b" stroke-width="2" />
  <rect x="22" y="22" width="1156" height="586" rx="18" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Top-left glowing accent -->
  <circle cx="100" cy="100" r="150" fill="#ff7f50" opacity="0.05" filter="url(#glow)" />

  <!-- Vite Logo Icon Group -->
  <g transform="translate(100, 150)">
    <!-- Ambient glow behind Vite logo -->
    <circle cx="40" cy="40" r="45" fill="#BD34FE" opacity="0.25" filter="url(#glow)" />

    <!-- Vite Logo SVG scaled to 80x80 -->
    <g transform="scale(0.3125)">
      <path fill="url(#vite-grad-bg)" d="M255.153 37.938L134.897 252.976c-2.483 4.44-8.862 4.466-11.382.048L.875 37.958c-2.746-4.814 1.371-10.646 6.827-9.67l120.385 21.517a6.537 6.537 0 0 0 2.322-.004l117.867-21.483c5.438-.991 9.574 4.796 6.877 9.62Z" />
      <path fill="url(#vite-grad-bolt)" d="M185.432 13.808l-62.198 11.23a3.267 3.267 0 0 0-2.68 3.193l-.223 57.575a3.267 3.267 0 0 0 3.738 3.232l16.11-2.617a3.267 3.267 0 0 1 3.734 3.652l-3.328 22.022a3.267 3.267 0 0 0 3.82 3.715l16.638-2.702a3.267 3.267 0 0 1 3.733 3.653l-8.625 57.065c-.56 3.704 4.225 5.894 6.643 3.036l1.378-1.628 65.577-122.923c1.782-3.342-.998-7.327-4.743-6.648l-18.46 3.348a3.267 3.267 0 0 1-3.734-3.652l4.89-32.328a3.267 3.267 0 0 0-3.82-3.715l-16.59 2.694a3.267 3.267 0 0 1-3.733-3.653l3.056-20.218a3.267 3.267 0 0 0-4.13-3.682Z" />
    </g>
  </g>

  <!-- Brand Text -->
  <text x="200" y="190" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ff7f50" letter-spacing="4">AREA44</text>
  <text x="200" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#a1a1aa" letter-spacing="2">OPEN GRAPH PLAYGROUND</text>

  <!-- Large Title -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="80" fill="url(#text-gradient)" letter-spacing="-2">OG Images Coral</text>

  <!-- Subtitle -->
  <text x="100" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#e4e4e7" letter-spacing="0.5">Beautiful In-Browser Open Graph Image Templates</text>

  <!-- Meta details / Tags at bottom -->
  <g transform="translate(100, 510)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="38" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="80" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#fb923c" text-anchor="middle">SATORI ENGINE</text>

    <!-- Tag 2 -->
    <rect x="175" y="0" width="160" height="38" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="255" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#f43f5e" text-anchor="middle">TAILWIND CSS</text>

    <!-- Tag 3 -->
    <rect x="350" y="0" width="160" height="38" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="430" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#a1a1aa" text-anchor="middle">REACT 19 &amp; VITE 8</text>
  </g>

  <!-- Live Status Pulse Badge -->
  <g transform="translate(1000, 510)">
    <circle cx="15" cy="18" r="6" fill="#10b981" />
    <circle cx="15" cy="18" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
    <text x="35" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#10b981" letter-spacing="1">LIVE PREVIEW</text>
  </g>
</svg>
